services:
  users-service:
    build: .
    command: uvicorn users_service.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

  orders-service:
    build: .
    command: uvicorn orders_service.main:app --host 0.0.0.0 --port 8002
    environment:
      USERS_SERVICE_URL: http://users-service:8001
    ports:
      - "8002:8002"
    depends_on:
      - users-service

  api-gateway:
    build: .
    command: uvicorn api_gateway.main:app --host 0.0.0.0 --port 8000
    environment:
      USERS_SERVICE_URL: http://users-service:8001
      ORDERS_SERVICE_URL: http://orders-service:8002
    ports:
      - "8000:8000"
    depends_on:
      - users-service
      - orders-service